# Shared defaults for all training runs. Per-size YAMLs use `extends: base.yaml`
# and override only what differs.

seed: 0
parameterization: sp        # "sp" or "mup"
precision: bfloat16         # auto-fallback to fp16 on Turing or older

model:
  vocab_size: 4096
  block_size: 1024
  dropout: 0.0
  bias: false

optimizer:
  name: adamw
  lr: null                  # filled in by the LR sweep, then by the scaling wrapper
  betas: [0.9, 0.95]
  weight_decay: 0.1
  eps: 1.0e-8

schedule:
  warmup_steps: 10
  max_steps: 92             # 2 epochs x 46 steps over the 24M-token corpus
  min_lr_ratio: 0.1

batch:
  tokens_per_step: 524288   # 512K, invariant across sizes per spec
  block_size: 1024
  # micro_batch set per-size; grad_accum derived as
  #   tokens_per_step / (micro_batch * block_size)

eval:
  every_steps: 10           # ~9 evals over 92 steps for clean curves
  val_tokens: 524288

paths:
  train_bin: data/tokens/train.bin
  val_bin: data/tokens/val.bin
  tokenizer: data/tokenizer/tokenizer.json
  checkpoints_dir: checkpoints
  runs_dir: runs
